apiVersion: v1
kind: Service
metadata:
  name: {{ include "app-with-db.name" . }}
  labels:
    {{- include "app-with-db.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: {{ .Values.app.service.type }}
  selector:
    {{- include "app-with-db.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      targetPort: http
      protocol: TCP
